name: Build All Platforms and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione (es: 43.01.00)'
        required: true
        default: '0.0.0'
      release_notes:
        description: 'Note di rilascio (opzionale)'
        required: false
        default: 'Release'

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make update script executable
        run: chmod +x scripts/update_version.sh

      - name: Update version in pubspec.yaml
        run: bash scripts/update_version.sh ${{ github.event.inputs.version }}

      - name: Configure git for actions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit version changes
        run: |
          git add pubspec.yaml
          if git diff --staged --quiet; then
            echo "⚠️  Nessuna modifica da committare (versione già aggiornata)"
          else
            git commit -m "chore: bump version to ${{ github.event.inputs.version }}"
            git push origin master
            echo "✓ Versione aggiornata a ${{ github.event.inputs.version }}"
          fi

  build-android:
    needs: [update-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'

      - name: Android diagnostics
        run: |
          echo "== flutter --version =="
          flutter --version || true
          echo "\n== flutter doctor -v =="
          flutter doctor -v || true
          echo "\n== android tree =="
          ls -la android || true
          echo "\n== android app src main =="
          ls -la android/app/src/main || true
          echo "\n== AndroidManifest.xml content =="
          sed -n '1,200p' android/app/src/main/AndroidManifest.xml || true

      - name: Make android script executable
        run: chmod +x scripts/build_android.sh

      - name: Build Android APK
        run: bash scripts/build_android.sh ${{ github.event.inputs.version }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ligaduck-android-${{ github.event.inputs.version }}
          path: build/ligaduck-v${{ github.event.inputs.version }}.apk

  build-ios:
    needs: [update-version]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'

      - name: iOS diagnostics
        run: |
          echo "== flutter --version =="
          flutter --version || true
          echo "\n== xcodebuild -version =="
          xcodebuild -version || true

      - name: Make ios script executable
        run: chmod +x scripts/build_ios.sh

      - name: Build iOS IPA (unsigned, for testing)
        run: bash scripts/build_ios.sh ${{ github.event.inputs.version }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ligaduck-ios-${{ github.event.inputs.version }}
          path: build/ligaduck-v${{ github.event.inputs.version }}.ipa

  build-macos:
    needs: [update-version]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Make macos script executable
        run: chmod +x scripts/build_macos.sh

      - name: Build macOS DMG
        run: bash scripts/build_macos.sh ${{ github.event.inputs.version }}

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ligaduck-macos-${{ github.event.inputs.version }}
          path: |
            build/ligaduck-v${{ github.event.inputs.version }}.dmg
            build/ligaduck-v${{ github.event.inputs.version }}-macos.zip

  build-windows:
    needs: [update-version]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows release
        run: flutter build windows --release -v

      - name: Verify build structure
        run: |
          $src = Join-Path $PWD 'build\windows\x64\runner\Release'
          Write-Host "Verifying build structure..."
          
          $requiredFiles = @(
            'LigaDuckManager.exe',
            'flutter_windows.dll',
            'data\icudtl.dat',
            'data\app.so'
          )
          
          foreach ($file in $requiredFiles) {
            $fullPath = Join-Path $src $file
            if (-not (Test-Path $fullPath)) {
              Write-Host "❌ Missing: $file"
              exit 1
            } else {
              Write-Host "✓ Found: $file"
            }
          }
          
          if (-not (Test-Path (Join-Path $src 'data\flutter_assets'))) {
            Write-Host "❌ Missing: data\flutter_assets"
            exit 1
          }
          Write-Host "✓ Build structure verified"

      - name: Create ZIP with correct structure
        run: |
          $version='${{ github.event.inputs.version }}'
          $out = Join-Path $PWD "build\ligaduck-v$version-windows.zip"
          if (Test-Path $out) { Remove-Item $out -Force }
          $src = Join-Path $PWD 'build\windows\x64\runner\Release'
          
          Write-Host "Creating ZIP: $out"
          Write-Host "From directory: $src"
          
          # Create ZIP preserving directory structure
          Push-Location $src
          Compress-Archive -Path * -DestinationPath $out -Force
          Pop-Location
          
          if (Test-Path $out) {
            $size = (Get-Item $out).Length / 1MB
            Write-Host "✓ ZIP created: $out ($([math]::Round($size, 2)) MB)"
            
            # Verify ZIP contents
            Write-Host "`nZIP contents (first 20 entries):"
            Add-Type -Assembly System.IO.Compression.FileSystem
            $zip = [System.IO.Compression.ZipFile]::OpenRead($out)
            $zip.Entries | Select-Object -First 20 | ForEach-Object { Write-Host "  $($_.FullName)" }
            $zip.Dispose()
          } else {
            Write-Host "❌ Failed to create ZIP"
            exit 1
          }

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ligaduck-windows-${{ github.event.inputs.version }}
          path: build/ligaduck-v${{ github.event.inputs.version }}-windows.zip

  build-windows-msix:
    needs: [update-version]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Setup commercial certificate (if available)
        if: ${{ secrets.WINDOWS_CERT_BASE64 != '' }}
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          PUBLISHER: ${{ secrets.WINDOWS_PUBLISHER }}
        run: |
          if ($env:WINDOWS_CERT_BASE64) {
            Write-Host "🔐 Commercial certificate detected, configuring..."
            
            # Decode and save certificate
            $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64)
            $certPath = Join-Path $env:TEMP "codesign-cert.pfx"
            [IO.File]::WriteAllBytes($certPath, $certBytes)
            
            Write-Host "✓ Certificate saved to temp location"
            
            # Update pubspec.yaml with certificate info
            $content = Get-Content pubspec.yaml -Raw
            $certConfig = @"
  certificate_path: $certPath
  certificate_password: $env:CERT_PASSWORD
  publisher: $env:PUBLISHER
"@
            $content = $content -replace '(?m)^  install_certificate:.*$', "install_certificate: false`n$certConfig"
            $content | Set-Content pubspec.yaml -NoNewline
            
            Write-Host "✓ MSIX configured with commercial certificate"
            Write-Host "  Publisher: $env:PUBLISHER"
          } else {
            Write-Host "ℹ️  No commercial certificate, using auto-generated test certificate"
          }

      - name: Update MSIX version
        run: |
          $version = '${{ github.event.inputs.version }}'
          # Split version and remove leading zeros from each part
          $parts = $version.Split('.')
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2]
          $msixVersion = "$major.$minor.$patch.0"
          
          Write-Host "Converting version $version to MSIX format: $msixVersion"
          
          $content = Get-Content pubspec.yaml -Raw
          $content = $content -replace 'msix_version:.*', "msix_version: $msixVersion"
          $content | Set-Content pubspec.yaml -NoNewline
          
          Write-Host "✓ MSIX version updated to $msixVersion"

      - name: Build MSIX package
        run: flutter pub run msix:create --release --install-certificate false

      - name: Verify and rename MSIX
        run: |
          $version = '${{ github.event.inputs.version }}'
          $msixFile = "build\windows\x64\runner\Release\ligaduck.msix"
          
          if (Test-Path $msixFile) {
            $size = (Get-Item $msixFile).Length / 1MB
            Write-Host "✓ MSIX created: $([math]::Round($size, 2)) MB"
            
            # Create artifacts directory
            if (-not (Test-Path "artifacts")) {
              New-Item -ItemType Directory -Path "artifacts"
            }
            
            # Rename and copy
            $destination = "artifacts\LigaDuckManager-Windows-v$version.msix"
            Copy-Item $msixFile $destination
            Write-Host "✓ MSIX ready: $destination"
          } else {
            Write-Host "❌ MSIX file not found"
            exit 1
          }

      - name: Copy installation scripts to artifacts
        run: |
          Copy-Item "scripts\install_msix_windows.ps1" "artifacts\"
          Copy-Item "scripts\INSTALL_MSIX_README.txt" "artifacts\README.txt"
          Write-Host "✓ Installation helper files added"

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: ligaduck-windows-msix-${{ github.event.inputs.version }}
          path: artifacts/*

  create-release:
    needs: [build-android, build-ios, build-macos, build-windows, build-windows-msix]
    if: '!cancelled()'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Android APK
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ligaduck-android-${{ github.event.inputs.version }}
          path: build

      - name: Download iOS IPA
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ligaduck-ios-${{ github.event.inputs.version }}
          path: build

      - name: Download macOS DMG
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ligaduck-macos-${{ github.event.inputs.version }}
          path: build

      - name: Download Windows ZIP
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ligaduck-windows-${{ github.event.inputs.version }}
          path: build

      - name: Download Windows MSIX
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ligaduck-windows-msix-${{ github.event.inputs.version }}
          path: artifacts

      - name: Ensure release script is executable
        run: chmod +x scripts/create_github_release.sh

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Configure git for actions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Run release script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: master
        run: |
          echo "${{ github.event.inputs.release_notes }}" | bash scripts/create_github_release.sh ${{ github.event.inputs.version }}
