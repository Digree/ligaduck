name: Build All Platforms and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione (es: 43.01.00)'
        required: true
        default: '0.0.0'
      release_notes:
        description: 'Note di rilascio (opzionale)'
        required: false
        default: 'Release'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'

      - name: Android diagnostics
        run: |
          echo "== flutter --version =="
          flutter --version || true
          echo "\n== flutter doctor -v =="
          flutter doctor -v || true
          echo "\n== android tree =="
          ls -la android || true
          echo "\n== android app src main =="
          ls -la android/app/src/main || true
          echo "\n== AndroidManifest.xml content =="
          sed -n '1,200p' android/app/src/main/AndroidManifest.xml || true

      - name: Make android script executable
        run: chmod +x scripts/build_android.sh

      - name: Build Android APK
        run: bash scripts/build_android.sh ${{ github.event.inputs.version }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ligaduck-android-${{ github.event.inputs.version }}
          path: build/ligaduck-v${{ github.event.inputs.version }}.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'

      - name: iOS diagnostics
        run: |
          echo "== flutter --version =="
          flutter --version || true
          echo "\n== xcodebuild -version =="
          xcodebuild -version || true

      - name: Make ios script executable
        run: chmod +x scripts/build_ios.sh

      - name: Build iOS IPA (unsigned, for testing)
        run: bash scripts/build_ios.sh ${{ github.event.inputs.version }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ligaduck-ios-${{ github.event.inputs.version }}
          path: build/ligaduck-v${{ github.event.inputs.version }}.ipa

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'

      - name: Make macos script executable
        run: chmod +x scripts/build_macos.sh

      - name: Build macOS DMG
        run: bash scripts/build_macos.sh ${{ github.event.inputs.version }}

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ligaduck-macos-${{ github.event.inputs.version }}
          path: build/ligaduck-v${{ github.event.inputs.version }}.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows release
        run: flutter build windows --release -v

      - name: Create ZIP (exclude .pdb)
        run: |
          $version='${{ github.event.inputs.version }}'
          $out = Join-Path $PWD "build\ligaduck-v$version-windows.zip"
          if (Test-Path $out) { Remove-Item $out -Force }
          $src = Join-Path $PWD 'build\windows\x64\runner\Release'
          Get-ChildItem -Path $src -Recurse -File | Where-Object { $_.Extension -ne '.pdb' } | ForEach-Object { $_.FullName } | Compress-Archive -DestinationPath $out -Update

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ligaduck-windows-${{ github.event.inputs.version }}
          path: build/ligaduck-v${{ github.event.inputs.version }}-windows.zip

  create-release:
    needs: [build-android, build-ios, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: ligaduck-android-${{ github.event.inputs.version }}
          path: build

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ligaduck-ios-${{ github.event.inputs.version }}
          path: build

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: ligaduck-macos-${{ github.event.inputs.version }}
          path: build

      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: ligaduck-windows-${{ github.event.inputs.version }}
          path: build

      - name: Ensure release script is executable
        run: chmod +x scripts/create_github_release.sh

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Configure git for actions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run release script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: master
        run: |
          echo "${{ github.event.inputs.release_notes }}" | bash scripts/create_github_release.sh ${{ github.event.inputs.version }}
