name: Build Windows MSIX

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione (es: 43.01.00)'
        required: true
        default: '0.0.0'
      release_notes:
        description: 'Note di rilascio (opzionale)'
        required: false
        default: 'Release'

permissions:
  contents: write
  
jobs:
  build-windows-msix:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Setup commercial certificate (if available)
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          PUBLISHER: ${{ secrets.WINDOWS_PUBLISHER }}
        run: |
          if ($env:WINDOWS_CERT_BASE64) {
            Write-Host "🔐 Commercial certificate detected, configuring..."
            
            # Decode and save certificate
            $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64)
            $certPath = Join-Path $env:TEMP "codesign-cert.pfx"
            [IO.File]::WriteAllBytes($certPath, $certBytes)
            
            Write-Host "✓ Certificate saved to temp location"
            
            # Update pubspec.yaml with certificate info
            $content = Get-Content pubspec.yaml -Raw
            $certConfigLine1 = "  certificate_path: $certPath"
            $certConfigLine2 = "  certificate_password: $env:CERT_PASSWORD"
            $certConfigLine3 = "  publisher: $env:PUBLISHER"
            $certConfig = "$certConfigLine1`n$certConfigLine2`n$certConfigLine3"
            $content = $content -replace '(?m)^  install_certificate:.*$', "install_certificate: false`n$certConfig"
            $content | Set-Content pubspec.yaml -NoNewline
            
            Write-Host "✓ MSIX configured with commercial certificate"
            Write-Host "  Publisher: $env:PUBLISHER"
          } else {
            Write-Host "ℹ️  No commercial certificate, using auto-generated test certificate"
          }

      - name: Update MSIX version
        run: |
          $version = '${{ github.event.inputs.version }}'
          # Split version and remove leading zeros from each part
          $parts = $version.Split('.')
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2]
          $msixVersion = "$major.$minor.$patch.0"
          
          Write-Host "Converting version $version to MSIX format: $msixVersion"
          
          $content = Get-Content pubspec.yaml -Raw
          $content = $content -replace 'msix_version:.*', "msix_version: $msixVersion"
          $content | Set-Content pubspec.yaml -NoNewline
          
          Write-Host "✓ MSIX version updated to $msixVersion"

      - name: Set CMAKE_GENERATOR for Windows build
        run: |
          $env:CMAKE_GENERATOR = 'Visual Studio 17 2022'
          Write-Host "CMAKE_GENERATOR set to: $env:CMAKE_GENERATOR"
          # Add to GitHub environment for subsequent steps
          Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_GENERATOR=Visual Studio 17 2022"

      - name: Build MSIX package
        run: flutter pub run msix:create --release --install-certificate false

      - name: Verify MSIX build
        run: |
          $msixFile = "build\windows\x64\runner\Release\ligaduck.msix"
          
          if (Test-Path $msixFile) {
            $size = (Get-Item $msixFile).Length / 1MB
            Write-Host "✓ MSIX created: $([math]::Round($size, 2)) MB"
          } else {
            Write-Host "❌ MSIX file not found at: $msixFile"
            exit 1
          }

      - name: Create artifacts directory
        run: |
          if (-not (Test-Path "artifacts")) {
            New-Item -ItemType Directory -Path "artifacts"
          }

      - name: Rename and move MSIX
        run: |
          $version = '${{ github.event.inputs.version }}'
          $source = "build\windows\x64\runner\Release\ligaduck.msix"
          $destination = "artifacts\LigaDuckManager-Windows-v$version.msix"
          
          Copy-Item $source $destination
          
          if (Test-Path $destination) {
            $size = (Get-Item $destination).Length / 1MB
            Write-Host "✓ MSIX ready: $destination ($([math]::Round($size, 2)) MB)"
          } else {
            Write-Host "❌ Failed to copy MSIX"
            exit 1
          }

      - name: Copy installation scripts to artifacts
        run: |
          Copy-Item "scripts\install_msix_windows.ps1" "artifacts\"
          Copy-Item "scripts\INSTALL_MSIX_README.txt" "artifacts\README.txt"
          Write-Host "✓ Installation helper files added"

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ligaduck-windows-msix-${{ github.event.inputs.version }}
          path: artifacts/*

  create-release:
    needs: build-windows-msix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download MSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: ligaduck-windows-msix-${{ github.event.inputs.version }}
          path: artifacts

      - name: Ensure release script is executable
        run: chmod +x scripts/create_github_release.sh

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Configure git for actions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          NOTES="${{ github.event.inputs.release_notes }}"
          TAG="v$VERSION"
          
          # Aggiungi istruzioni di installazione alle note
          INSTALL_INSTRUCTIONS="

          ## 📦 Installazione MSIX (Windows 10/11)

          **Metodo consigliato:**
          1. Scarica l'artifact \`ligaduck-windows-msix-$VERSION.zip\`
          2. Estrai tutto il contenuto
          3. Clicca destro su \`install_msix_windows.ps1\`
          4. Seleziona \"Esegui con PowerShell\"
          5. Conferma privilegi amministratore

          Lo script installerà automaticamente il certificato e l'app.

          **Nota:** Questo pacchetto usa un certificato auto-generato per test.
          Vedi \`README.txt\` nell'artifact per istruzioni dettagliate."
          
          FULL_NOTES="$NOTES$INSTALL_INSTRUCTIONS"
          
          # Check if release exists
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists, uploading MSIX..."
            gh release upload "$TAG" artifacts/* --clobber
          else
            echo "Creating new release $TAG..."
            echo "$FULL_NOTES" | gh release create "$TAG" \
              --title "LigaDuck Manager v$VERSION" \
              --notes-file - \
              artifacts/*
          fi
          
          echo "✓ Release created/updated with MSIX package"
