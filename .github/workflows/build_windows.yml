name: Build Windows ZIP

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione (es: 43.01.00)'
        required: true
        default: '0.0.0'
      release_notes:
        description: 'Note di rilascio (opzionale)'
        required: false
        default: 'Release'

permissions:
  contents: write
  
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release -v

      - name: Verify build structure
        run: |
          $src = Join-Path $PWD 'build\windows\x64\runner\Release'
          Write-Host "Verifying build structure..."
          
          $requiredFiles = @(
            'LigaDuckManager.exe',
            'flutter_windows.dll',
            'data\icudtl.dat',
            'data\app.so'
          )
          
          $missingFiles = @()
          foreach ($file in $requiredFiles) {
            $fullPath = Join-Path $src $file
            if (-not (Test-Path $fullPath)) {
              $missingFiles += $file
              Write-Host "❌ Missing: $file"
            } else {
              Write-Host "✓ Found: $file"
            }
          }
          
          if ($missingFiles.Count -gt 0) {
            Write-Host "❌ Build verification failed!"
            exit 1
          }
          
          if (-not (Test-Path (Join-Path $src 'data\flutter_assets'))) {
            Write-Host "❌ Missing: data\flutter_assets"
            exit 1
          }
          Write-Host "✓ Build structure verified"

      - name: Create README.txt
        run: |
          $src = Join-Path $PWD 'build\windows\x64\runner\Release'
          $readme = Join-Path $src 'README.txt'
          
          "=================================================" | Out-File -FilePath $readme -Encoding UTF8
          "  Liga Duck Manager - Windows" | Out-File -FilePath $readme -Append -Encoding UTF8
          "=================================================" | Out-File -FilePath $readme -Append -Encoding UTF8
          "" | Out-File -FilePath $readme -Append -Encoding UTF8
          "IMPORTANTE - Come estrarre ed eseguire:" | Out-File -FilePath $readme -Append -Encoding UTF8
          "" | Out-File -FilePath $readme -Append -Encoding UTF8
          "1. Estrai TUTTO il contenuto di questo ZIP in una cartella" | Out-File -FilePath $readme -Append -Encoding UTF8
          "2. NON spostare solo il file .exe - deve rimanere insieme agli altri file!" | Out-File -FilePath $readme -Append -Encoding UTF8
          "3. Esegui ""LigaDuckManager.exe""" | Out-File -FilePath $readme -Append -Encoding UTF8
          "" | Out-File -FilePath $readme -Append -Encoding UTF8
          "La struttura delle cartelle DEVE essere:" | Out-File -FilePath $readme -Append -Encoding UTF8
          "  LigaDuckManager.exe" | Out-File -FilePath $readme -Append -Encoding UTF8
          "  flutter_windows.dll" | Out-File -FilePath $readme -Append -Encoding UTF8
          "  data/" | Out-File -FilePath $readme -Append -Encoding UTF8
          "    icudtl.dat" | Out-File -FilePath $readme -Append -Encoding UTF8
          "    app.so" | Out-File -FilePath $readme -Append -Encoding UTF8
          "    flutter_assets/" | Out-File -FilePath $readme -Append -Encoding UTF8
          "" | Out-File -FilePath $readme -Append -Encoding UTF8
          "Se l'app non si avvia, verifica che:" | Out-File -FilePath $readme -Append -Encoding UTF8
          "- Hai estratto TUTTI i file" | Out-File -FilePath $readme -Append -Encoding UTF8
          "- La cartella ""data"" e' accanto al file .exe" | Out-File -FilePath $readme -Append -Encoding UTF8
          "- Hai Windows 10 o superiore" | Out-File -FilePath $readme -Append -Encoding UTF8
          "" | Out-File -FilePath $readme -Append -Encoding UTF8
          "Per supporto: https://github.com/ripudima/ligaduck" | Out-File -FilePath $readme -Append -Encoding UTF8
          
          Write-Host "✓ README.txt created"

      - name: Create ZIP with correct structure
        run: |
          $version = '${{ github.event.inputs.version }}'
          $out = Join-Path $PWD "build\ligaduck-v$version-windows.zip"
          if (Test-Path $out) { Remove-Item $out -Force }
          $src = Join-Path $PWD 'build\windows\x64\runner\Release'
          
          Write-Host "Creating ZIP: $out"
          Write-Host "From directory: $src"
          
          # Create ZIP preserving directory structure
          Push-Location $src
          Compress-Archive -Path * -DestinationPath $out -Force
          Pop-Location
          
          if (Test-Path $out) {
            $size = (Get-Item $out).Length / 1MB
            Write-Host "✓ ZIP created: $out ($([math]::Round($size, 2)) MB)"
            
            Write-Host "`nZIP contents (first 20 entries):"
            Add-Type -Assembly System.IO.Compression.FileSystem
            $zip = [System.IO.Compression.ZipFile]::OpenRead($out)
            $zip.Entries | Select-Object -First 20 | ForEach-Object { Write-Host "  $($_.FullName)" }
            $zip.Dispose()
          } else {
            Write-Host "❌ Failed to create ZIP"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ligaduck-windows-${{ github.event.inputs.version }}
          path: build/ligaduck-v${{ github.event.inputs.version }}-windows.zip

  create-release:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: ligaduck-windows-${{ github.event.inputs.version }}
          path: build

      - name: Ensure release script is executable
        run: chmod +x scripts/create_github_release.sh

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Configure git for actions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run release script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: master
        run: |
          # Pass release notes via stdin to the existing script
          echo "${{ github.event.inputs.release_notes }}" | bash scripts/create_github_release.sh ${{ github.event.inputs.version }}
