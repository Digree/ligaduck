name: ligaduck
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  carousel_slider: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Franklin Gothic
      fonts:
        - asset: assets/font/framd.ttf
  assets:
    - assets/logo_champions.png
    - assets/squadre/paperopoli.png
    - assets/squadre/golden_city.png
    - assets/divise/divise_43/paperopoli_1.png
    - assets/divise/divise_43/paperopoli_2.png
    - assets/miscellaneous/stadium.png
    - assets/trophies/champions_league.png
    - assets/miscellaneous/divisa_1.png
    - assets/nations/italy.png
