name: ligaduck
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  carousel_slider: ^5.1.1
  http: ^0.13.6
  provider: ^6.1.1
  oktoast: ^3.3.1
  translator: ^0.1.7
  file_picker: ^5.2.5
  smooth_page_indicator: ^1.1.0
  csv: ^6.0.0
  mongo_dart: ^0.10.0
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_gen_runner: ^5.3.1
  build_runner: any

flutter_icons:
  ios: true
  android: true
  macos:
    generate: true
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  fonts:
    - family: Franklin Gothic
      fonts:
        - asset: assets/font/framd.ttf
  assets:
    #loghi competizione
    - assets/logos/

    #loghi squadre
    - assets/squadre/

    #divise
    - assets/divise/divise_43/

    #miscellaneous
    - assets/miscellaneous/

    #trofei
    - assets/trophies/

    #nazioni
    - assets/nations/
