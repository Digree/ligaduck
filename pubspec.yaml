name: ligaduck
description: "A new Flutter project."
publish_to: "none"
version: 44.02.01

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  carousel_slider: ^5.1.1
  http: ^1.6.0
  provider: ^6.1.1
  oktoast: ^3.3.1
  file_selector: ^1.0.4
  smooth_page_indicator: ^2.0.1
  csv: ^6.0.0
  mongo_dart: ^0.10.0
  font_awesome_flutter: ^11.0.0
  glassmorphism: ^3.0.0
  shared_preferences: ^2.2.2
  keyboard_actions: ^4.2.0
  package_info_plus: ^10.1.0
  url_launcher: ^6.2.5
  path_provider: ^2.1.2

  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_gen_runner: ^5.3.1
  build_runner: any
  msix: ^3.17.0

flutter_icons:
  ios: true
  android: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  macos:
    generate: true
  image_path: "assets/icon/icon.png"

msix_config:
  display_name: LigaDuck Manager
  publisher_display_name: LigaDuck
  identity_name: com.ligaduck.manager
  msix_version: 43.1.2.0  # Format: major.minor.patch.0 (no leading zeros)
  logo_path: assets/icon/icon44x44msix.png
  icons_background_color: "#0180f4"
  capabilities: internetClient
  languages: it-IT, en-US
  install_certificate: false  # Don't install certificate automatically (for CI/CD)
  # Per certificato commerciale, decommenta e configura:
  # certificate_path: C:/path/to/your-codesign-cert.pfx
  # certificate_password: your-secure-password
  # publisher: CN=Your Company Name, O=Your Organization, L=City, S=State, C=IT
  
flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/font/Inter-Regular.ttf
        - asset: assets/font/Inter-Italic.ttf
          style: italic
        - asset: assets/font/Inter-Bold.ttf
          weight: 700
        - asset: assets/font/Inter-BoldItalic.ttf
          weight: 700
          style: italic
    - family: champions
      fonts:
        - asset: assets/font/champions.ttf
    - family: europa
      fonts:
        - asset: assets/font/europa.ttf
    - family: supercup
      fonts:
        - asset: assets/font/supercup.otf
  assets:
    #icone
    - assets/icon/

    #loghi competizione
    - assets/logos/
    - assets/logos/34/
    - assets/logos/35/
    - assets/logos/36/
    - assets/logos/37/
    - assets/logos/38/
    - assets/logos/39/
    - assets/logos/40/
    - assets/logos/41/
    - assets/logos/42/
    - assets/logos/43/
    - assets/logos/44/


    #loghi squadre
    - assets/squadre/

    #divise
    - assets/divise/divise_43/
    - assets/divise/divise_44/

    #miscellaneous
    - assets/miscellaneous/

    #trofei
    - assets/trophies/

    #nazioni
    - assets/nations/
